name: Supabase keep-alive

on:
  schedule:
    # 06h17, 12h17 e 18h17 — horário de Brasília
    - cron: '17 9,15,21 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar movie_progress
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/movie_progress?select=movie_id&limit=1" \
            --output /dev/null
